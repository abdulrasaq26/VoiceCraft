<!doctype html><meta charset="utf-8"><title>Live timing chain</title>
<body style="font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;background:#0e1315;color:#e8edeb;padding:16px;max-width:112ch">
<h1 style="font-size:1.1rem">Live Fish → Whisper → project → editor</h1>
<p style="color:#8998a0;max-width:86ch">
  Strictly live. Narration is generated by Fish TTS, aligned by the real
  <code>/v1/align</code>, and every module downstream runs unmodified. There is no recorded
  fallback: if the endpoint is unreachable this page fails rather than substituting fixtures.
</p>
<pre id="out" style="white-space:pre-wrap"></pre>

<div id="stubs" hidden>
  <div id="editor-card"></div><button id="ed-assemble"></button><div id="ed-summary"></div>
  <div id="ed-status"></div><div id="ed-stage"></div><canvas id="ed-canvas"></canvas>
  <button id="ed-play"></button><input id="ed-seek" type="range" /><span id="ed-time"></span>
  <div id="ed-timeline"></div><select id="ed-sub-font"></select><input id="ed-sub-size" />
  <span id="ed-sub-size-val"></span><select id="ed-sub-pos"></select><input id="ed-sub-color" />
  <input id="ed-sub-on" type="checkbox" /><select id="ed-res"><option value="360">360</option></select>
  <button id="ed-export-video"></button><button id="ed-export-package"></button>
  <input id="title-input" value="live timing" /><input id="ed-up-images" type="file" />
  <input id="ed-up-audio" type="file" /><input id="ed-up-subs" type="file" />
  <button id="ed-build-manual"></button><button id="ed-manual-toggle"></button>
  <div id="ed-manual"></div><input id="ed-crossfade" type="checkbox" />
</div>

<script src="graphic-renderer.js"></script>
<script src="adapters/provider-manager.js"></script>
<script src="adapters/fish-adapter.js"></script>
<script src="transcription/transcript.js"></script>
<script src="transcription/timing.js"></script>
<script src="transcription/align-project.js"></script>
<script src="sync-engine.js"></script>
<script src="voice-cloning.js"></script>
<script src="project-assets.js"></script>
<script src="editor.js"></script>
<script>
const out = document.getElementById('out');
const say = (s) => { out.textContent += s + '\n'; };
const fails = [];
const check = (n, c, d) => {
  say((c ? '  PASS  ' : '  FAIL  ') + n + (c ? '' : '  <- ' + JSON.stringify(d)));
  if (!c) fails.push(n);
};

// Written so one phrase is unambiguous to look for afterwards.
const SCRIPT = 'American factories transformed almost overnight. '
             + 'Forty percent of the workforce on that line were women. '
             + 'Today the same site builds electric vehicle batteries.';

function fishEndpoint() {
  try {
    const raw = localStorage.getItem('blvck:keys_fishaudio') || '';
    const v = raw.trim().startsWith('"') ? JSON.parse(raw) : raw;
    return String(v || '').replace(/\/+$/, '');
  } catch { return ''; }
}

(async () => {
  const T = window.Transcript, TM = window.Timing, A = window.BlvckAlign, E = window.BlvckEditorTiming;
  const ep = fishEndpoint();
  const headers = { 'Content-Type': 'application/json', 'x-fish-endpoint': ep };

  say('--- 0. the endpoint ---');
  check('a Fish endpoint is configured', !!ep, 'blvck:keys_fishaudio is empty');
  if (!ep) { window.__done = { fails }; return; }
  say('  ' + ep);

  let status;
  try {
    const r = await fetch('/api/proxy/fish/aether/status', { headers });
    status = await r.json();
  } catch (e) {
    check('Fish is reachable', false, e.message);
    window.__done = { fails }; return;
  }
  check('Fish is reachable', !!status.ok, status);
  check('the backend reports alignment support', status.alignment === true, status);
  say(`  voices: ${(status.voices || []).length}`);

  // ── 1. Real narration from Fish ────────────────────────────────────────
  say('');
  say('--- 1. generate the narration with Fish TTS ---');
  // Through FishAdapter, not a raw POST. The engine OOMs as a function of
  // generated tokens, so a whole paragraph in one request returns 500
  // "Failed to generate speech" — the adapter is what splits and retries, and
  // it is the path production actually uses.
  const t0 = performance.now();
  let audioBlob;
  try {
    if (!window.FishAdapter) throw new Error('FishAdapter is not loaded');
    const url = await window.FishAdapter.textToSpeech({
      input: SCRIPT,
      voice: (status.voices || [])[0] || 'default',
      onProgress: (m) => say('    ' + m)
    });
    if (!url) throw new Error('the adapter returned nothing');
    audioBlob = await (await fetch(url)).blob();
  } catch (e) {
    check('Fish generated the narration', false, e.message
      + (window.FishAdapter && window.FishAdapter.lastError()
         ? ' | lastError: ' + window.FishAdapter.lastError() : ''));
    window.__done = { fails }; return;
  }
  const ttsMs = Math.round(performance.now() - t0);
  check('Fish generated the narration', audioBlob && audioBlob.size > 2048,
        { bytes: audioBlob && audioBlob.size });
  say(`  ${(audioBlob.size / 1024).toFixed(1)} KB of ${audioBlob.type || 'audio'} in ${ttsMs}ms`);

  // Decode it so the duration is measured from the audio, not claimed.
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await audioBlob.arrayBuffer());
  say(`  decodes to ${buf.duration.toFixed(2)}s at ${buf.sampleRate}Hz`);
  const wav = window.BlvckVoiceCloning.encodeWav(buf.getChannelData(0), buf.sampleRate);
  say(`  re-encoded to ${(wav.size / 1024).toFixed(1)} KB WAV for alignment`);

  // ── 2. Real forced alignment ───────────────────────────────────────────
  say('');
  say('--- 2. align it with the real /v1/align ---');
  const t1 = performance.now();
  const timeline = await window.BlvckSync.timelineFor(SCRIPT, {
    audioBlob: wav, durationSec: buf.duration, allowAlignment: true, force: true
  });
  const alignMs = Math.round(performance.now() - t1);
  check('the sync engine returned an ALIGNED timeline', timeline && timeline.source === 'aligned',
        { source: timeline && timeline.source, provider: timeline && timeline.provider });
  check('the provider was the forced-alignment one, not a fallback',
        timeline && timeline.provider === 'aether-forced-alignment',
        { provider: timeline && timeline.provider });
  check('real word timings came back', !!(timeline && timeline.words && timeline.words.length > 10),
        { words: timeline && timeline.words && timeline.words.length });
  say(`  ${timeline.words.length} words in ${alignMs}ms, confidence ${timeline.confidence}`);
  say(`  first 8: ${timeline.words.slice(0, 8).map((w) => `${w.text}@${w.start}`).join(' ')}`);
  window.__timeline = timeline;

  // ── 3. Transcript ──────────────────────────────────────────────────────
  say('');
  say('--- 3. Transcript.fromSyncTimeline ---');
  const fingerprint = T.fingerprint({ byteLength: wav.size, duration: buf.duration });
  const transcript = T.fromSyncTimeline(timeline, {
    script: SCRIPT, audioFingerprint: fingerprint, model: timeline.provider
  });
  check('a transcript is produced', !!transcript);
  check('it is measured', T.isMeasured(transcript), transcript && transcript.source);
  check('it carries word timings', T.hasWordTimings(transcript));
  say(`  ${T.words(transcript).length} words, ${(transcript.segments || []).length} segment(s), `
    + `audio ${transcript.audioDuration}s, fingerprint ${transcript.audioFingerprint}`);

  // The identifiable phrase, with its REAL measured position.
  const hit = T.findPhrase(transcript, 'forty percent');
  check('"forty percent" is found in the real alignment', !!hit, 'phrase not found');
  if (hit) {
    say(`  >>> "forty percent" measured at ${hit.start.toFixed(3)}s → ${hit.end.toFixed(3)}s `
      + `(matched "${hit.matched}")`);
  }
  window.__hit = hit;

  // ── 4. Persistence ─────────────────────────────────────────────────────
  say('');
  say('--- 4. save, then reload the project ---');
  // Beats placed against the MEASURED audio, which is what a Director working
  // from a real transcript produces. Hardcoding windows here would test a
  // project whose shots disagree with its own narration — and the overlay would
  // then correctly refuse to anchor, proving nothing about the anchoring.
  const segs = transcript.segments || [];
  say(`  placing ${segs.length} beat(s) on the measured segment boundaries:`);
  const scenes = segs.map((s, i) => {
    const beat = {
      index: i,
      timestamp: `${s.start.toFixed(3)} - ${s.end.toFixed(3)}`,
      subtitle: s.text,
      status: 'pending',
      timelineStart: s.start,
      timelineEnd: s.end
    };
    // The statistic beat carries the card the Director planned for it.
    if (/forty percent/i.test(s.text)) {
      beat.textOverlay = { text: '40%', emphasis: 'forty percent', style: 'stat' };
    }
    say(`    [${i}] ${s.start.toFixed(2)}→${s.end.toFixed(2)}s  ${s.text.slice(0, 52)}`);
    return beat;
  });
  check('a beat carries the planned overlay', scenes.some((s) => s.textOverlay),
        'no segment contained the phrase');

  localStorage.setItem('blvck-tts:storyboard', JSON.stringify({
    project: 'live timing', cues: [], bible: null, assetMode: 'STOCK', useRefs: false,
    scenes
  }));
  A.save(transcript);

  // Simulate exactly what saveProject() does now: rebuild the payload around
  // whatever is already stored.
  const before = JSON.parse(localStorage.getItem('blvck-tts:storyboard'));
  localStorage.setItem('blvck-tts:storyboard', JSON.stringify(Object.assign({}, before, {
    project: 'live timing', cues: [], bible: null, assetMode: 'STOCK', useRefs: true,
    scenes: before.scenes
  })));

  // Re-read from storage the way a fresh page load would.
  const reloaded = A.current();
  check('sb.transcript survives the save', !!reloaded);
  check('it is still measured after reload', T.isMeasured(reloaded), reloaded && reloaded.source);
  check('word timings survive', T.words(reloaded).length === T.words(transcript).length,
        { before: T.words(transcript).length, after: T.words(reloaded).length });
  check('the fingerprint survives', reloaded.audioFingerprint === fingerprint,
        { stored: reloaded.audioFingerprint, expected: fingerprint });
  const hit2 = T.findPhrase(reloaded, 'forty percent');
  check('the measured phrase position is unchanged after reload',
        !!hit2 && Math.abs(hit2.start - hit.start) < 0.001, { before: hit && hit.start, after: hit2 && hit2.start });

  // ── 5. The editor's clock ──────────────────────────────────────────────
  say('');
  say('--- 5. the editor is now on a measured clock ---');
  const sb = JSON.parse(localStorage.getItem('blvck-tts:storyboard'));
  const measured = T.isMeasured(sb.transcript);
  const placed = sb.scenes.some((s) => Number.isFinite(s.timelineStart) && Number.isFinite(s.timelineEnd));
  const derived = (measured && placed) ? 'whisper' : 'estimated';
  check('timingSource derives to "whisper"', derived === 'whisper', { measured, placed });
  E._setState({
    clips: sb.scenes.map((s) => {
      const c = document.createElement('canvas'); c.width = 320; c.height = 180;
      c.getContext('2d').fillStyle = '#204060';
      c.getContext('2d').fillRect(0, 0, 320, 180);
      return { sceneIndex: s.index, subtitle: '', durationSec: s.timelineEnd - s.timelineStart,
               timelineStart: s.timelineStart, timelineEnd: s.timelineEnd,
               effect: 'zoom-in', img: c, video: null };
    }),
    audio: { buffers: [], offsets: [], totalMs: Math.round(buf.duration * 1000) },
    timingSource: derived
  });
  check('authoritative() is true', E.authoritative() === true);
  check('the beats are not rescaled to the audio', E.rescaleClipsToAudio() === 0);

  // ── 6. Stale detection ─────────────────────────────────────────────────
  say('');
  say('--- 6. stale detection against the real fingerprint ---');
  check('the same audio is not stale',
        T.isStale(reloaded, { byteLength: wav.size, duration: buf.duration }) === false);
  check('re-recorded audio IS stale',
        T.isStale(reloaded, { byteLength: wav.size + 9000, duration: buf.duration + 2.5 }) === true);
  const st = await A.status();
  say(`  BlvckAlign.status() → ${st.state}`);

  // ── 7. forDirector ─────────────────────────────────────────────────────
  say('');
  say('--- 7. what the Director is handed ---');
  const fd = A.forDirector();
  check('Transcript.forDirector produces a payload', !!fd);
  if (fd) {
    check('it is labelled whisper', fd.timingSource === 'whisper', fd.timingSource);
    check('it carries the measured audio duration', Number(fd.audioDuration) > 0, fd.audioDuration);
    const segWords = (fd.segments || []).reduce((n, s) => n + ((s.words || []).length), 0);
    check('it carries real word timings', segWords > 10, { segments: (fd.segments || []).length, words: segWords });
    say(`  ${(fd.segments || []).length} segment(s), ${segWords} word timings`);
    say(`  first segment: ${JSON.stringify((fd.segments || [])[0] || {}).slice(0, 220)}`);
  }

  // ── 8. Overlay anchored to the REAL spoken word ────────────────────────
  say('');
  say('--- 8. the "40%" card against the real measured voice ---');
  const shot = sb.scenes.find((s) => s.textOverlay);
  const ov = TM.overlayForShot(shot, reloaded);
  check('an overlay is derived from the Director\'s textOverlay', !!ov);
  if (ov && hit) {
    say(`  ${JSON.stringify(ov)}`);
    check('anchored to the spoken phrase', ov.method === 'spoken_phrase', ov.method);
    check('anchored to the real measured position',
          Math.abs(ov.start - Math.max(shot.timelineStart, hit.start - 0.15)) < 0.02,
          { overlayStart: ov.start, spokenAt: hit.start, shotStart: shot.timelineStart });
    say(`  >>> spoken at ${hit.start.toFixed(3)}s, card shown ${ov.start}s → ${ov.end}s`);

    const clip = { sceneIndex: shot.index, subtitle: '', durationSec: 5,
                   timelineStart: shot.timelineStart, timelineEnd: shot.timelineEnd,
                   effect: 'zoom-in', video: null, editorialOverlay: ov,
                   img: (() => { const c = document.createElement('canvas'); c.width = 320; c.height = 180;
                                 const g = c.getContext('2d'); g.fillStyle = '#204060'; g.fillRect(0, 0, 320, 180); return c; })() };
    const midMs = ((ov.start + ov.end) / 2) * 1000;
    check('the renderer shows it while the words are spoken', !!E.overlayActiveAt(clip, midMs));
    check('and not at the top of the shot',
          E.overlayActiveAt(clip, (shot.timelineStart + 0.02) * 1000) === null
          || ov.start <= shot.timelineStart + 0.05, { ovStart: ov.start, shotStart: shot.timelineStart });

    E._setState({ clips: [clip], audio: { buffers: [], offsets: [], totalMs: Math.round(buf.duration*1000) }, timingSource: 'whisper' });
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
    const g = cv.getContext('2d');
    E.renderTo(g, 640, 360, (shot.timelineStart + 0.02) * 1000);
    const without = g.getImageData(0, 0, 640, 360).data;
    E.renderTo(g, 640, 360, midMs);
    const withOv = g.getImageData(0, 0, 640, 360).data;
    let diff = 0;
    for (let i = 0; i < withOv.length; i += 4) if (Math.abs(withOv[i] - without[i]) > 12) diff++;
    say(`  pixels changed by the card: ${diff}`);
    check('the card is really drawn', diff > 500, { diff });
  }

  say('');
  say('alignment source: LIVE Fish /v1/align on LIVE Fish TTS audio');
  say(fails.length ? 'FAILED (' + fails.length + '): ' + fails.join(', ') : 'LIVE TIMING CHAIN PASSES');
  window.__done = { fails: fails, spokenAt: hit ? hit.start : null, overlay: ov || null };
})().catch((e) => {
  say('ERROR: ' + e.message);
  say(e.stack || '');
  window.__done = { fails: ['threw'] };
});
</script>
