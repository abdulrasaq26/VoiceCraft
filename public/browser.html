<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser — Frameloom Studio</title>
  <link rel="icon" href="/brand/frameloom-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="studio-tokens.css" />
  <link rel="stylesheet" href="browser.css" />
</head>
<body>
  <!-- Tab strip -->
  <div class="tabstrip" id="tabstrip">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="icon-btn newtab" id="btn-new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <button class="icon-btn" id="btn-back" title="Back (Alt+Left)" aria-label="Back" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-forward" title="Forward (Alt+Right)" aria-label="Forward" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-reload" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg class="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="icon-btn" id="btn-home" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </button>

    <button class="netchip" id="net-chip" title="Network for this tab" hidden></button>
    <div class="omnibox" id="omnibox">
      <span class="omnibox__icon" id="omnibox-icon" title="">
        <svg class="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <svg class="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <svg class="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </span>
      <input type="text" id="address-bar" spellcheck="false" autocomplete="off" placeholder="Search or enter address" />
      <button class="omnibox__zoom" id="btn-zoom" title="Reset zoom" hidden>100%</button>
      <button class="icon-btn icon-btn--sm" id="btn-star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9Z"/></svg>
      </button>
    </div>

    <div class="flowtools" id="flowtools" hidden>
      <button class="tool" id="btn-flow-downloader" title="Flow Downloader — scan this page for media (click again to close)">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Downloader
      </button>
      <button class="tool" id="btn-flow-automator" title="Flow Automator (click again to close)">
        <svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6Z"/></svg>Automator
      </button>
      <button class="tool" id="btn-prompt-recovery" title="Prompt Recovery (click again to close)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v3l2 2"/></svg>Prompts
      </button>
    </div>

    <button class="icon-btn" id="btn-downloads" title="Downloads (Ctrl+J)" aria-label="Downloads">
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span class="badge" id="dl-badge" hidden></span>
      <span class="dlring" id="dl-ring" hidden></span>
    </button>
    <button class="icon-btn" id="btn-panel-bookmarks" title="Bookmarks" aria-label="Bookmarks">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>
    </button>
    <button class="icon-btn" id="btn-panel-history" title="History (Ctrl+H)" aria-label="History">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
    </button>
    <button class="icon-btn" id="btn-focus" title="Focus mode — full screen, toolbar stays (F11)" aria-label="Focus mode" aria-pressed="false">
      <svg class="i-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="i-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="Settings (Ctrl+,)" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
    <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </button>
  </div>

  <!-- Bookmarks bar -->
  <div class="bmbar" id="bmbar"></div>

  <!-- Find bar (takes layout space so the page view never covers it) -->
  <div class="findbar" id="findbar" hidden>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="text" id="find-input" placeholder="Find in page" spellcheck="false" />
    <span class="findbar__count" id="find-count"></span>
    <button class="icon-btn icon-btn--sm" id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button class="icon-btn icon-btn--sm" id="find-next" title="Next (Enter)" aria-label="Next match"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="icon-btn icon-btn--sm" id="find-close" title="Close (Esc)" aria-label="Close find"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- Page area + side panel -->
  <div class="work">
    <div class="viewport" id="viewport">
      <div class="empty" id="empty-state" hidden>
        <div class="empty__logo">V</div>
        <h2>No tabs open</h2>
        <p>Open a new tab to start browsing.</p>
        <div class="empty__actions">
          <button class="btn btn--primary" id="empty-new-tab">New tab</button>
          <button class="btn" id="empty-flow">Open Google Flow</button>
        </div>
      </div>
      <div class="empty" id="not-desktop" hidden>
        <div class="empty__logo">V</div>
        <h2>Desktop app required</h2>
        <p>The built-in browser runs inside the Frameloom Studio desktop app. Open Frameloom Studio to use it.</p>
      </div>
    </div>

    <aside class="side" id="side" hidden>
      <div class="side__head">
        <h3 id="side-title">Downloads</h3>
        <div class="side__actions" id="side-actions"></div>
        <button class="icon-btn icon-btn--sm" id="side-close" title="Close panel" aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="side__search" id="side-search-wrap" hidden>
        <input type="search" id="side-search" placeholder="Search" />
      </div>
      <div class="side__body" id="side-body"></div>
    </aside>
  </div>

  <!-- Settings (hides the page view while open so it can't cover this) -->
  <!-- A website's file picker: the project's files first (see BrowserManager.pickFiles) -->
  <div class="modal" id="filepick" hidden role="dialog" aria-modal="true" aria-labelledby="fp-title">
    <div class="fp">
      <div class="fp__head">
        <div class="fp__titles">
          <h2 id="fp-title">Choose a file to upload</h2>
          <p class="fp__sub" id="fp-sub"></p>
        </div>
        <button class="icon-btn" id="fp-close" title="Cancel (Esc)" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="fp__body" id="fp-body"></div>
      <div class="fp__foot">
        <button class="btn" id="fp-browse">Browse this PC…</button>
        <span class="fp__grow"></span>
        <button class="btn" id="fp-cancel">Cancel</button>
        <button class="btn btn--primary" id="fp-use" disabled>Upload</button>
      </div>
    </div>
  </div>
  <div class="apptoast" id="app-toast" role="status" hidden></div>

  <div class="modal" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings">
      <nav class="settings__nav" id="settings-nav">
        <div class="settings__brand">Settings</div>
        <button data-sec="general" class="is-on">General</button>
        <button data-sec="appearance">Appearance</button>
        <button data-sec="privacy">Privacy &amp; data</button>
        <button data-sec="downloads">Downloads</button>
        <button data-sec="profiles">Profiles</button>
        <button data-sec="network">Network &amp; proxy</button>
        <button data-sec="flow">Flow tools &amp; extension</button>
        <button data-sec="shortcuts">Keyboard shortcuts</button>
        <button data-sec="about">About</button>
      </nav>
      <div class="settings__main">
        <div class="settings__head">
          <h2 id="settings-title">General</h2>
          <button class="icon-btn" id="settings-close" title="Close (Esc)" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="settings__body" id="settings-body"></div>
        <div class="settings__toast" id="settings-toast" hidden></div>
      </div>
    </div>
  </div>

  <script src="browser.js"></script>
</body>
</html>
